openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CleanSpot API - Waste reporting platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: reports
    description: Waste report operations
  - name: officers
    description: Government officer operations
  - name: admin
    description: Admin operations
  - name: auth
    description: Authentication operations
  - name: notifications
    description: In-app and push notification operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login for officer or admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current logged-in user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          description: Not authenticated

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List all reports (admin) or assigned reports (officer)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [reported, cleaning, cleaned]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportList"
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a new waste report (citizen)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportBody"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "409":
          description: Duplicate report nearby
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateReportResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a single report by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Not found
    patch:
      operationId: updateReport
      tags: [reports]
      summary: Update report status (officer)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportBody"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{id}/track:
    get:
      operationId: trackReport
      tags: [reports]
      summary: Track report status by ID (public, no auth required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportStatus"
        "404":
          description: Not found

  /reports/stats/summary:
    get:
      operationId: getReportsSummary
      tags: [reports]
      summary: Get report stats summary
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsSummary"

  /officers:
    get:
      operationId: listOfficers
      tags: [officers]
      summary: List all officers (admin only)
      responses:
        "200":
          description: List of officers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficerList"
    post:
      operationId: createOfficer
      tags: [officers]
      summary: Create new officer (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOfficerBody"
      responses:
        "201":
          description: Officer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Officer"

  /officers/{id}:
    get:
      operationId: getOfficer
      tags: [officers]
      summary: Get officer details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Officer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Officer"
    patch:
      operationId: updateOfficer
      tags: [officers]
      summary: Update officer (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOfficerBody"
      responses:
        "200":
          description: Updated officer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Officer"
    delete:
      operationId: deleteOfficer
      tags: [officers]
      summary: Delete officer (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /officers/{id}/reports:
    get:
      operationId: getOfficerReports
      tags: [officers]
      summary: Get reports assigned to a specific officer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [reported, cleaning, cleaned]
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
            description: Maximum number of reports to return
        - name: days
          in: query
          schema:
            type: integer
            description: Only return reports from the last N days (e.g. 90)
      responses:
        "200":
          description: Officer's reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportList"

  /admin/reports:
    get:
      operationId: adminListReports
      tags: [admin]
      summary: Admin view of all reports with full details
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [reported, cleaning, cleaned]
        - name: officerId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: archived
          in: query
          schema:
            type: boolean
          description: If true, return archived (soft-deleted) reports instead of active ones
      responses:
        "200":
          description: All reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportList"

  /admin/analytics:
    get:
      operationId: getDistrictAnalytics
      tags: [admin]
      summary: District-wide analytics for the Control Center (admin/control_center roles)
      description: >
        KPIs, 14-day trend, officer leaderboard (with top-performer and below-target flags),
        repeat-report hotspots, delay metrics (reported→cleaning, reported→cleaned, overall
        resolution and open-report age, plus a per-ward breakdown), and the longest-outstanding
        open reports.
      responses:
        "200":
          description: District-wide analytics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistrictAnalyticsResponse"

  /admin/reports/bulk-archive-preview:
    get:
      operationId: getBulkArchivePreview
      tags: [admin]
      summary: Preview how many active reports would be archived by an age cutoff
      parameters:
        - name: olderThanDays
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Count of reports that would be archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkArchivePreviewResponse"

  /admin/reports/bulk-archive:
    post:
      operationId: bulkArchiveReports
      tags: [admin]
      summary: Archive all active reports older than N days (soft delete, any status)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkArchiveBody"
      responses:
        "200":
          description: Number of reports archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkArchiveResponse"

  /admin/reports/archived/purge-all:
    delete:
      operationId: purgeAllArchivedReports
      tags: [admin]
      summary: Permanently delete all archived reports (hard delete, irreversible)
      responses:
        "200":
          description: Number of reports permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeArchivedResponse"

  /admin/reports/{id}/permanent:
    delete:
      operationId: permanentDeleteReport
      tags: [admin]
      summary: Permanently delete a single archived report (hard delete, irreversible)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Report is not archived yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/backfill-photo-analysis:
    post:
      operationId: backfillPhotoAnalysis
      tags: [admin]
      summary: Trigger AI photo analysis on reports that have a photo but no AI analysis yet
      responses:
        "200":
          description: Backfill started or completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillPhotoAnalysisResponse"

  /admin/reports/{id}/reassign:
    post:
      operationId: reassignReport
      tags: [admin]
      summary: Reassign report to a different officer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignReportBody"
      responses:
        "200":
          description: Report reassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /notifications/vapid-public-key:
    get:
      operationId: getVapidPublicKey
      tags: [notifications]
      summary: Get VAPID public key for push subscription
      responses:
        "200":
          description: VAPID public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidPublicKeyResponse"

  /notifications/push-subscription:
    post:
      operationId: savePushSubscription
      tags: [notifications]
      summary: Save or update a browser push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionBody"
      responses:
        "200":
          description: Subscription saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    delete:
      operationId: deletePushSubscription
      tags: [notifications]
      summary: Remove a push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
              required: [endpoint]
      responses:
        "200":
          description: Subscription removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the current user
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /notifications/test:
    post:
      operationId: sendTestPushNotification
      tags: [notifications]
      summary: Send a test push notification to the current user's active subscriptions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Test notification sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestPushResponse"
        "400":
          description: No active subscription found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Push not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/anonymous-subscription:
    post:
      operationId: saveAnonymousPushSubscription
      tags: [notifications]
      summary: Save an anonymous push subscription linked to a report (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnonymousPushSubscriptionBody"
      responses:
        "200":
          description: Subscription saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /uploads/image:
    post:
      operationId: uploadImage
      tags: [reports]
      summary: Upload an image and get back a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadImageBody"
      responses:
        "200":
          description: Image URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadImageResponse"

components:
  schemas:
    PhotoItem:
      type: object
      properties:
        url:
          type: string
        uploadedAt:
          type: string
          description: ISO-8601 timestamp of when this photo was uploaded
      required: [url, uploadedAt]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
        smtpConfigured:
          type: boolean
      required: [status, smtpConfigured]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    TestPushResponse:
      type: object
      properties:
        success:
          type: boolean
        sent:
          type: integer
        error:
          type: string
      required: [success]

    DistrictAnalyticsResponse:
      type: object
      properties:
        kpis:
          type: object
          properties:
            totalReports: { type: integer }
            completionRate: { type: integer, description: "Percent of active reports with status=cleaned" }
            activeHotspots: { type: integer }
            officersBelowTarget: { type: integer }
            reported: { type: integer }
            cleaning: { type: integer }
            cleaned: { type: integer }
          required: [totalReports, completionRate, activeHotspots, officersBelowTarget, reported, cleaning, cleaned]
        dailyTrend:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              reported: { type: integer }
              cleaning: { type: integer }
              cleaned: { type: integer }
              total: { type: integer }
            required: [date, reported, cleaning, cleaned, total]
        officerLeaderboard:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              areaName: { type: string, nullable: true }
              panchayatName: { type: string, nullable: true }
              total: { type: integer }
              cleaned: { type: integer }
              pending: { type: integer }
              resolutionRate: { type: integer }
              avgResolutionHours: { type: number, nullable: true }
              avgReportedToCleaningHours: { type: number, nullable: true }
              overdueCount: { type: integer }
              belowTarget: { type: boolean, description: "resolutionRate<50% or overdueCount>=3" }
              topPerformer: { type: boolean, description: "One of the top 3 officers by resolution rate" }
            required: [id, name, total, cleaned, pending, resolutionRate, avgResolutionHours, avgReportedToCleaningHours, overdueCount, belowTarget, topPerformer]
        hotspots:
          type: array
          items:
            type: object
            properties:
              lat: { type: number }
              lng: { type: number }
              count: { type: integer }
              address: { type: string, nullable: true }
              trend: { type: string, enum: [worsening, improving, steady] }
            required: [lat, lng, count, trend]
        delayMetrics:
          type: object
          properties:
            avgReportedToCleaningHours: { type: number, nullable: true }
            medianReportedToCleaningHours: { type: number, nullable: true }
            avgReportedToCleanedHours: { type: number, nullable: true }
            medianReportedToCleanedHours: { type: number, nullable: true }
            avgResolutionHours: { type: number, nullable: true }
            medianResolutionHours: { type: number, nullable: true }
            avgOpenHours: { type: number, nullable: true }
            byWard:
              type: array
              items:
                type: object
                properties:
                  ward: { type: string }
                  total: { type: integer }
                  avgReportedToCleaningHours: { type: number, nullable: true }
                  avgReportedToCleanedHours: { type: number, nullable: true }
                required: [ward, total, avgReportedToCleaningHours, avgReportedToCleanedHours]
          required: [avgReportedToCleaningHours, medianReportedToCleaningHours, avgReportedToCleanedHours, medianReportedToCleanedHours, avgResolutionHours, medianResolutionHours, avgOpenHours, byWard]
        oldestOpenReports:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              status: { type: string }
              address: { type: string, nullable: true }
              latitude: { type: number }
              longitude: { type: number }
              createdAt: { type: string, format: date-time }
              hoursOpen: { type: number }
              assignedOfficer:
                type: object
                nullable: true
                properties:
                  id: { type: integer }
                  name: { type: string }
                  areaName: { type: string, nullable: true }
            required: [id, status, latitude, longitude, createdAt, hoursOpen]
        wasteComposition:
          type: object
          properties:
            types:
              type: array
              items:
                type: object
                properties:
                  type: { type: string }
                  count: { type: integer }
                  pct: { type: integer, description: "Percentage share of total waste type occurrences" }
                required: [type, count, pct]
            severityBreakdown:
              type: array
              items:
                type: object
                properties:
                  severity: { type: string, enum: [low, medium, high] }
                  count: { type: integer }
                required: [severity, count]
            topBrands:
              type: array
              items:
                type: object
                properties:
                  brand: { type: string }
                  count: { type: integer }
                  pct: { type: integer, description: "Percentage share of total brand occurrences" }
                required: [brand, count, pct]
            aiAnalysedCount: { type: integer }
            unanalysedCount: { type: integer }
          required: [types, severityBreakdown, topBrands, aiAnalysedCount, unanalysedCount]
      required: [kpis, dailyTrend, officerLeaderboard, hotspots, delayMetrics, oldestOpenReports]

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserInfo"
        token:
          type: string
      required: [user]

    UserInfo:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [officer, admin, field_officer, control_center, panchayat_admin]
        officerId:
          type: integer
          nullable: true
        panchayatName:
          type: string
          nullable: true
      required: [id, email, name, role]

    Report:
      type: object
      properties:
        id:
          type: integer
        imageUrl:
          type: string
          nullable: true
        imageUploadedAt:
          type: string
          format: date-time
          nullable: true
          description: Server-recorded timestamp of when the photo was uploaded
        imageUrls:
          type: array
          items:
            $ref: "#/components/schemas/PhotoItem"
          nullable: true
          description: All uploaded report photos with timestamps (max 2)
        cleanupImageUrl:
          type: string
          nullable: true
        cleanupImageUrls:
          type: array
          items:
            $ref: "#/components/schemas/PhotoItem"
          nullable: true
          description: All cleanup photos uploaded by officer (max 5)
        latitude:
          type: number
        longitude:
          type: number
        address:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [reported, cleaning, cleaned]
        reporterEmail:
          type: string
          nullable: true
          description: Only included for admin and panchayat_admin roles
        reporterIp:
          type: string
          nullable: true
        assignedOfficerId:
          type: integer
          nullable: true
        assignedOfficer:
          $ref: "#/components/schemas/OfficerBasic"
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when the report is archived (soft-deleted). Null means the report is active.
        wasteTypes:
          type: array
          items:
            type: string
          nullable: true
          description: AI-identified waste categories (e.g. plastic bottles, food waste)
        brandNames:
          type: array
          items:
            type: string
          nullable: true
          description: AI-identified brand names visible on packaging
        wasteSeverity:
          type: string
          enum: [low, medium, high]
          nullable: true
          description: AI-assessed severity of the waste (low/medium/high)
        photoAiAnalysedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when AI photo analysis was completed
      required: [id, latitude, longitude, status, createdAt, updatedAt]

    ReportList:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        total:
          type: integer
      required: [reports, total]

    ReportStatus:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [reported, cleaning, cleaned]
        createdAt:
          type: string
          format: date-time
        updatedAt:
